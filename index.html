
<!DOCTYPE html>
<html>
<head>
    <title>Results Summary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <div class="hero">
            <h3>Your Result</h3>
            <div class="score">
                <h1>76</h1>
                <p>of 100</p>
            </div>
            <div class="result-copy">
                <h2>Great</h2>
                <p>
                    You scored higher than 65% of the people
                    who have taken these tests.
                </p>
            </div>
        </div>
        <div class="villain">
            <h3>Summary</h3>
            <div class="summary-item">
            <img src="./assets/images/icon-reaction.svg">
                <p>Reaction</p>
                <p>80 / 100</p>
            </div>
            <div class="summary-item">
            <img src="./assets/images/icon-memory.svg">
                <p>Memory</p>
                <p>92 / 100</p>
            </div>
            <div class="summary-item">
            <img src="./assets/images/icon-verbal.svg">
                <p>Verbal</p>
                <p>61 / 100</p>
            </div>
            <div class="summary-item">
            <img src="./assets/images/icon-visual.svg">
                <p>Visual</p>
                <p>72 / 100</p>
            </div>
            <button>Continue</button>
        </div>
    </div>
</body>
</html>
